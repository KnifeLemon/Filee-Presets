# Checks a pull request that adds or changes a preset.
#
# Started three ways:
# - submission.yml calls it (workflow_call) right after it opens or updates a submission pull request. That pull
#   request comes from GITHUB_TOKEN, and GitHub doesn't start other workflows for those, so it is called directly.
# - pull_request: pull requests by people (rules only; forks get the result in the job summary). Submission pull
#   requests opened by github-actions[bot] are skipped here; submission.yml already checks them.
# - a `/review` comment by a maintainer (owner, member or collaborator) on any pull request: the full check.
#
# rules   Repository rules (tools/check.py) plus Filee's own validator (`filee presets check --json`, built from
#         KnifeLemon/Filee at the FILEE_REF variable). The PR's files are checked out as data only; the tools always
#         come from main.
# review  AI review (Claude Code via anthropics/claude-code-action, read-only, advisory), for submission pull
#         requests and after `/review`.
# report  Comments the result, sets `ready` / `needs-review` / `needs-changes` and a `rules` commit status on the head.
name: Check preset

on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true
      head_sha:
        description: The pull request head commit to check
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["presets/**"]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: check-${{ inputs.pr || github.event.pull_request.number || format('comment-{0}', github.event.comment.id) }}
  cancel-in-progress: true

jobs:
  context:
    if: >-
      inputs.pr ||
      (github.event_name == 'pull_request' &&
       !(github.event.pull_request.user.login == 'github-actions[bot]' &&
         startsWith(github.event.pull_request.head.ref, 'submission/'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.ctx.outputs.pr }}
      sha: ${{ steps.ctx.outputs.sha }}
      called: ${{ steps.ctx.outputs.called }}
      review: ${{ steps.ctx.outputs.review }}
      report: ${{ steps.ctx.outputs.report }}
      assoc: ${{ steps.ctx.outputs.assoc }}
    steps:
      - id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CALL_PR: ${{ inputs.pr }}
          CALL_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
          PR_ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          called=false
          if [ -n "$CALL_PR" ]; then
            pr="$CALL_PR"; sha="$CALL_SHA"; called=true; review=true; report=true; assoc=NONE
          elif [ "$EVENT" = "issue_comment" ]; then
            pr="$PR_NUMBER"; review=true; report=true
            read -r sha assoc < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha + " " + .author_association')
          else
            pr="$PR_NUMBER"; sha="$PR_SHA"; assoc="$PR_ASSOC"
            same_repo=false
            [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && same_repo=true
            review=false
            case "$HEAD_REF" in
              submission/issue-*) [ "$same_repo" = true ] && [ "$PR_USER_TYPE" = "Bot" ] && review=true ;;
            esac
            report=$same_repo
          fi
          # Only owners and members may send several presets in one pull request (tools/check.py).
          printf '%s' "$assoc" | grep -Eq '^[A-Z_]{1,30}$' || assoc=NONE
          if ! printf '%s' "$pr" | grep -Eq '^[0-9]{1,9}$' || ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::No valid pull request number or head commit."
            exit 1
          fi
          {
            echo "pr=$pr"; echo "sha=$sha"; echo "called=$called"; echo "review=$review"; echo "report=$report"
            echo "assoc=$assoc"
          } >> "$GITHUB_OUTPUT"

  rules:
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check out the tools (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: Check out the pull request's presets (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
          path: pr
          persist-credentials: false
          sparse-checkout: presets

      - name: Check out Filee (for its validator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KnifeLemon/Filee
          ref: ${{ vars.FILEE_REF || 'feat/preset-gallery' }}
          path: filee
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: filee/global.json

      - name: Install tools
        run: python -m pip install --disable-pip-version-check -r base/tools/requirements.txt

      - name: Build the Filee validator
        run: dotnet build filee/src/Filee.Cli -c Release -o "$RUNNER_TEMP/filee-cli" -v quiet -nologo

      - name: List the changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.context.outputs.pr }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/files" |
            python -c 'import json,sys; print(json.dumps([f for page in json.load(sys.stdin) for f in page]))' > "$RUNNER_TEMP/changed.json"

      - name: Check the rules
        id: check
        env:
          ASSOC: ${{ needs.context.outputs.assoc }}
        run: |
          python base/tools/check.py --base base --pr pr --changed "$RUNNER_TEMP/changed.json" \
            --out "$RUNNER_TEMP/check" --cli "dotnet $RUNNER_TEMP/filee-cli/filee-cli.dll" \
            --author-association "$ASSOC"
          ok=$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["ok"]).lower())' "$RUNNER_TEMP/check/report.json")
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always() && steps.check.outcome == 'success'
        env:
          PR: ${{ needs.context.outputs.pr }}
        run: python base/tools/report.py --report "$RUNNER_TEMP/check/report.json" --pr "$PR" --dry-run > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.check.outcome == 'success'
        with:
          name: check
          path: ${{ runner.temp }}/check
          retention-days: 3

      - name: Fail when the rules fail
        if: steps.check.outputs.ok != 'true'
        run: |
          echo "::error::The preset does not pass the rules. See the summary or the pull request comment."
          exit 1

  # The AI review runs Claude Code (anthropics/claude-code-action) on the Claude subscription token. It gets:
  # - a workspace with only tags.json, tools/ (main) and ./submission (the checked preset: meta.json, preset.json
  #   and JPEG copies of the images); the pull request itself is never checked out here,
  # - a read-only GITHUB_TOKEN (contents: read), the Read tool only, no MCP tools, no Bash/Write/Edit/network,
  #   --permission-mode default (anything not allowed is denied; there is nobody to approve), few turns,
  # - a fixed prompt from tools/review.py. Its answer comes back as --json-schema structured output, and
  #   tools/review.py checks it field by field. Labels and comments are set later by the report job, never by Claude.
  review:
    needs: [context, rules]
    if: always() && needs.context.outputs.review == 'true' && needs.rules.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out tags.json and the tools (main), nothing else
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tags.json
            /tools/

      # claude-code-action puts /usr/bin first on PATH for later steps, so they call this Python by its path.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: py
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check
          path: ${{ runner.temp }}/check

      - name: Prepare the submission folder and the fixed prompt
        id: prep
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          "$PY" tools/review.py prepare --folder "$RUNNER_TEMP/check/preset" --out submission
          "$PY" tools/review.py prompt --folder submission --out "$RUNNER_TEMP/prompt.txt"
          # A model alias, so it works with the subscription token (CLAUDE_CODE_OAUTH_TOKEN) as with an API key.
          model="${REVIEW_MODEL:-haiku}"
          if ! printf '%s' "$model" | grep -Eq '^[a-z0-9][a-z0-9.-]{1,60}$'; then
            echo "::error::REVIEW_MODEL must be a model alias or id such as haiku or sonnet."
            exit 1
          fi
          schema=$("$PY" tools/review.py schema)
          {
            echo "prompt<<EOF_PROMPT_7f3a"
            cat "$RUNNER_TEMP/prompt.txt"
            echo "EOF_PROMPT_7f3a"
            # Read is the only tool; the deny rules keep it inside ./submission (and tags.json).
            echo "args=--model $model --permission-mode default --tools Read --disallowedTools \"mcp__*,Read(./.git/**),Read(./tools/**),Read(//proc/**),Read(//etc/**)\" --max-turns 8 --json-schema '$schema'"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "auth=yes" >> "$GITHUB_OUTPUT"
          else
            echo "auth=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=AI review skipped::No CLAUDE_CODE_OAUTH_TOKEN secret. The pull request goes to needs-review."
          fi

      - name: AI review (Claude Code, read-only)
        id: claude
        if: steps.prep.outputs.auth == 'yes'
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          # The subscription token; the API key is only a fallback when the token isn't set.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          # Called from submission.yml, the run belongs to the submitter's `issues` event, and the action only
          # starts for people with write access unless they are listed here. This job can't write anything (read-only
          # token, Read tool only), which is the case the action documents for this input. /review and people's
          # pull requests keep the normal write-access check. No allowed_bots: no path here has a bot as the actor.
          allowed_non_write_users: ${{ needs.context.outputs.called == 'true' && '*' || '' }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: ${{ steps.prep.outputs.args }}
          display_report: "false"
          show_full_output: "false"

      # The action hides Claude Code's output; when it fails, show the error it reported (no secrets are in it).
      - name: Show why the AI review failed
        if: steps.prep.outputs.auth == 'yes' && steps.claude.outcome != 'success'
        env:
          PY: ${{ steps.py.outputs.python-path }}
          EXECUTION: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: '"$PY" tools/review.py diagnose --execution "$EXECUTION"'

      - name: Check the verdict
        env:
          RAW: ${{ steps.claude.outputs.structured_output }}
          CONCLUSION: ${{ steps.prep.outputs.auth == 'yes' && (steps.claude.outcome == 'success' && steps.claude.outputs.conclusion || 'failure') || 'skipped' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/verdict"
          printf '%s' "$RAW" > "$RUNNER_TEMP/verdict/raw.json"
          "$PY" tools/review.py verdict --raw "$RUNNER_TEMP/verdict/raw.json" --conclusion "$CONCLUSION" \
            --out "$RUNNER_TEMP/verdict/verdict.json"
          rm "$RUNNER_TEMP/verdict/raw.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict/verdict.json
          retention-days: 3

  report:
    needs: [context, rules, review]
    if: >-
      always() && needs.context.outputs.report == 'true' &&
      (needs.rules.result == 'success' || needs.rules.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Check out the tools (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: check
          path: ${{ runner.temp }}/check

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.review.result == 'success'
        continue-on-error: true
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict

      - name: Comment, label and set the rules status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.context.outputs.pr }}
          SHA: ${{ needs.context.outputs.sha }}
        run: |
          python base/tools/report.py --report "$RUNNER_TEMP/check/report.json" \
            --verdict "$RUNNER_TEMP/verdict/verdict.json" --pr "$PR" --sha "$SHA"
